<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Soteria Forge — Enterprise safety training, built for airport scale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171B"/>
      <stop offset="1" stop-color="#1B1E23"/>
    </linearGradient>
    <linearGradient id="fsEmber" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F69A3C"/><stop offset="1" stop-color="#D8451A"/>
    </linearGradient>
    <linearGradient id="fsFlame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE6B0"/><stop offset="1" stop-color="#F8D38A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#FF7A3D" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FF7A3D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="fsClip"><path d="M60,12 L100,25 V58 C100,85 83,104 60,112 C37,104 20,85 20,58 V25 Z"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#fsEmber)"/>

  <!-- Lockup: forged-shield mark + wordmark -->
  <g transform="translate(80,74) scale(0.62)">
    <g clip-path="url(#fsClip)">
      <rect width="120" height="120" fill="url(#fsEmber)"/>
      <polygon points="60,12 20,25 20,58 60,112" fill="#AE3A14"/>
      <polygon points="60,12 100,25 100,58 60,112" fill="#DC481B"/>
      <polygon points="60,12 100,25 70,33 60,26" fill="#FFC774" opacity="0.85"/>
    </g>
    <path d="M60,40 C64,55 77,59 77,74 C77,88 69,98 60,98 C51,98 43,88 43,74 C43,64 51,59 54,51 C55,55 58,54 58,47 C58,44 59,42 60,40 Z" fill="url(#fsFlame)"/>
    <path d="M60,67 C61,74 67,77 67,83 C67,89 64,93 60,93 C56,93 53,89 53,83 C53,77 59,74 60,67 Z" fill="#E8551F"/>
    <path d="M60,12 L100,25 V58 C100,85 83,104 60,112 C37,104 20,85 20,58 V25 Z" fill="none" stroke="#1B1E23" stroke-width="3" opacity="0.9"/>
    <text x="132" y="76" font-family="Oswald,'Arial Narrow',sans-serif" font-weight="700" font-size="52" letter-spacing="0.5" fill="#F4F2EE">SOTERIA<tspan fill="#FF7A3D"> FORGE</tspan></text>
  </g>

  <text x="80" y="262" font-family="'Barlow Semi Condensed','Arial Narrow',sans-serif" font-size="22" font-weight="600" letter-spacing="8" fill="#FFB552">CAPABILITY BRIEF</text>

  <text font-family="Oswald,'Arial Narrow',sans-serif" font-weight="700" fill="#F4F2EE" letter-spacing="0.5">
    <tspan x="78" y="350" font-size="70">ENTERPRISE SAFETY TRAINING,</tspan>
    <tspan x="78" y="424" font-size="70">BUILT FOR AIRPORT SCALE.</tspan>
  </text>

  <text x="80" y="486" font-family="'Barlow Semi Condensed','Arial Narrow',sans-serif" font-size="27" fill="#A9B2BC">
    Multi-tenant, offline-first, standards-based LMS for a 1,000-employee deskless workforce.
  </text>

  <g font-family="'Barlow Semi Condensed','Arial Narrow',sans-serif" font-size="20" font-weight="600" fill="#F4F2EE">
    <rect x="80" y="536" width="176" height="44" rx="12" fill="#1B1E23" stroke="#3A4048"/>
    <text x="104" y="564">Offline-first</text>
    <rect x="272" y="536" width="172" height="44" rx="12" fill="#1B1E23" stroke="#3A4048"/>
    <text x="296" y="564">Multi-tenant</text>
    <rect x="460" y="536" width="166" height="44" rx="12" fill="#1B1E23" stroke="#3A4048"/>
    <text x="484" y="564">Audit-ready</text>
  </g>
</svg>
